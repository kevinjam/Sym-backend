# Quantum Trading API — api.quatumtrading.com
# Place at: /etc/nginx/sites-available/quant-api
# (keep your existing Certbot SSL lines; this is the clean shape)

upstream quant_trading_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.quatumtrading.com;

    ssl_certificate /etc/letsencrypt/live/api.quatumtrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quatumtrading.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://quant_trading_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.quatumtrading.com;
    return 301 https://$host$request_uri;
}
