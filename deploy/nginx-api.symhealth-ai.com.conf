# Sym Health API — api.symhealth-ai.com
#
# BOTH http:// and https:// must work (shipped mobile app uses HTTP).
# Do NOT add "return 301 https://…" on port 80 for this host.
#
# Install:
#   sudo cp nginx-api.symhealth-ai.com.conf /etc/nginx/sites-available/api.symhealth-ai.com
#   sudo ln -sf /etc/nginx/sites-available/api.symhealth-ai.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.symhealth-ai.com
#     → when certbot asks to redirect HTTP→HTTPS, choose NO (keep both).
#
# Cloudflare (api.symhealth-ai.com):
#   - SSL/TLS mode: Full (or Full strict after cert exists)
#   - "Always Use HTTPS" = OFF for this hostname (Page Rule / Configuration Rule)
#     otherwise the HTTP app gets redirected and breaks.
#   - DNS: orange cloud OK
#
# Node: 127.0.0.1:9000

upstream sym_health_api {
    server 127.0.0.1:9000;
    keepalive 32;
}

# ── HTTP (required for current production app) ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.symhealth-ai.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://sym_health_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

