# Deploy sym-backend to the production VPS (PM2).
#
# Required GitHub repository secrets:
#   DEPLOY_HOST     — server IP or hostname
#   DEPLOY_USER     — SSH user (e.g. ubuntu)
#   DEPLOY_SSH_KEY  — private key for SSH (full PEM)
#   BACKEND_ENV     — full production env file (multiline). Written to .env.production each deploy.
#
# Optional secret:
#   DEPLOY_PATH     — default /var/www/sym-backend

name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sym-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync application to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          TARGET="${DEPLOY_PATH:-/var/www/sym-backend}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude node_modules \
            --exclude .env \
            --exclude .env.production \
            --exclude .git \
            --exclude coverage \
            --exclude certs \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${TARGET}/"

      - name: Install deps, write env, restart PM2
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACKEND_ENV,DEPLOY_PATH
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_PATH:-/var/www/sym-backend}"
            cd "${APP_DIR}"

            if [ -z "${BACKEND_ENV:-}" ]; then
              echo "ERROR: Set GitHub secret BACKEND_ENV to your full production .env contents."
              exit 1
            fi

            printf '%s\n' "${BACKEND_ENV}" > "${APP_DIR}/.env.production"
            chmod 600 "${APP_DIR}/.env.production"

            if [ -f "${APP_DIR}/.env" ] && ! grep -q '^MONGODB_URI=mongodb+srv:' "${APP_DIR}/.env" 2>/dev/null; then
              echo "Removing stale ${APP_DIR}/.env (no Atlas MONGODB_URI)"
              rm -f "${APP_DIR}/.env"
            fi

            npm ci --omit=dev
            if pm2 describe sym-backend >/dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production --update-env
            else
              pm2 start ecosystem.config.cjs --env production
            fi
            pm2 save

            echo "--- recent logs ---"
            pm2 logs sym-backend --lines 25 --nostream || true
            echo "--- health ---"
            curl -sf "http://127.0.0.1:9000/api/public/health" || echo "health check failed"
