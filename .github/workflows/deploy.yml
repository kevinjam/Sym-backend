# Deploy sym-backend to the production VPS (PM2).
#
# Repository secrets:
#   SERVER_IP, SERVER_USER, SSH_PRIVATE_KEY  — SSH deploy
#   BACKEND_ENV (optional) — full .env.production; uploaded via scp (not inline in SSH script)
#
# Optional: DEPLOY_PATH (default /var/www/sym-backend)

name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sym-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SERVER_IP || secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER || secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      APP_ENV: ${{ secrets.BACKEND_ENV || secrets.PRODUCTION_ENV }}
      REMOTE_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/sym-backend' }}
    steps:
      - name: Require GitHub secrets
        run: |
          set -e
          missing=""
          [ -z "${SSH_HOST}" ] && missing="${missing} SERVER_IP"
          [ -z "${SSH_USER}" ] && missing="${missing} SERVER_USER"
          [ -z "${SSH_KEY}" ] && missing="${missing} SSH_PRIVATE_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}"
            exit 1
          fi
          if [ -z "${APP_ENV}" ]; then
            echo "::warning::BACKEND_ENV not set — existing .env.production on the server will be kept."
          fi
          echo "Deploy target: ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate backend root in this repo
        id: app
        run: |
          if [ -f server.js ] && [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f backend/server.js ] && [ -f backend/package.json ]; then
            echo "dir=backend" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find server.js"
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure deploy directory is writable
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "sudo mkdir -p '${REMOTE_PATH}' && sudo chown -R '${SSH_USER}:${SSH_USER}' '${REMOTE_PATH}'"

      - name: Rsync application to server
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          echo "Syncing to ${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude node_modules \
            --exclude .env \
            --exclude .env.production \
            --exclude .git \
            --exclude coverage \
            --exclude certs \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"

      - name: Upload .env.production
        if: env.APP_ENV != ''
        env:
          APP_ENV: ${{ env.APP_ENV }}
        run: |
          ENV_FILE="${RUNNER_TEMP}/sym.env.production"
          printf '%s\n' "$APP_ENV" > "${ENV_FILE}"
          echo "Uploading .env.production ($(wc -l < "${ENV_FILE}") lines)"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${ENV_FILE}" \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/.env.production"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod 600 '${REMOTE_PATH}/.env.production' && rm -f '${REMOTE_PATH}/.env'"

      - name: Install dependencies and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        env:
          REMOTE_PATH: ${{ env.REMOTE_PATH }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          envs: REMOTE_PATH
          script: |
            set -e
            cd "${REMOTE_PATH}"
            npm ci --omit=dev
            if pm2 describe sym-backend >/dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production --update-env
            else
              pm2 start ecosystem.config.cjs --env production
            fi
            pm2 save
            pm2 logs sym-backend --lines 25 --nostream || true
            curl -sf http://127.0.0.1:9000/api/public/health || echo "health check failed"
